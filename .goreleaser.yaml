# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

project_name: twit

before:
  hooks:
    - rustup default stable
    - rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
    - cargo fetch --locked

builds:
  # macOS build - native cargo
  # Note: fm-rs (FoundationModels) requires Apple Silicon - no x86_64 support
  - id: twit-macos
    builder: rust
    binary: twit
    command: build
    flags:
      - --release
      - --locked
    targets:
      - aarch64-apple-darwin

  # Linux builds - zigbuild (cross-compile from macOS)
  # Uses --no-default-features to disable audio (ALSA) for cross-compilation
  # Audio falls back to system player via open::that()
  - id: twit-linux
    builder: rust
    binary: twit
    command: zigbuild
    flags:
      - --release
      - --locked
      - --no-default-features
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

archives:
  - id: default
    ids:
      - twit-macos
      - twit-linux
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "all" }}universal
      {{- else if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Other"
      order: 999

release:
  github:
    owner: blacktop
    name: twit
  draft: false
  prerelease: auto
  mode: replace
  footer: |
    ### Summary
    **Full Changelog**: https://github.com/blacktop/twit/compare/{{ .PreviousTag }}...{{ .Tag }}
    ## Follow us
    - [Twitter](https://twitter.com/blacktop__)
    - [Mastodon](https://mastodon.social/@blacktop)
    - [Bluesky](https://bsky.app/profile/blacktop.bsky.social)

# Homebrew Cask for macOS distribution
homebrew_casks:
  - name: twit
    ids:
      - default  # Archive containing macOS build (goreleaser filters by OS)
    repository:
      owner: blacktop
      name: homebrew-tap
      branch: main
    homepage: https://github.com/blacktop/twit
    description: A beautiful TUI client for Twitter/X
    license: MIT
    # Remove quarantine for unsigned binary
    hooks:
      post:
        install: |
          if OS.mac?
            Dir.glob("#{staged_path}/**/twit").each do |f|
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", f]
            end
          end

# Generate source archive
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

# Software Bill of Materials
sboms:
  - artifacts: archive
